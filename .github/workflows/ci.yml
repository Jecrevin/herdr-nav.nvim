name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The routing tests drive a stub `herdr`, which is a shebang script: Node
      # refuses to spawn a .cmd equivalent without shell: true. The matcher they
      # mostly exercise is platform-relevant on Windows, so self-check runs there.
      - run: npm run test:node
        if: runner.os != 'Windows'
      - run: npm run self-check

  neovim:
    name: Neovim plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:lua
