id = "herdr-nav-nvim"
name = "Herdr Navigation"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Ctrl-hjkl across herdr panes and editor splits"
platforms = ["linux", "macos", "windows"]

# One action per direction. The editor side (Neovim's plugin/herdr_nav.lua, or
# any program listed in $HERDR_PLUGIN_CONFIG_DIR/nav.json) moves between its own
# splits and calls `herdr pane focus` back here at the edge.

[[actions]]
id = "left"
title = "Navigate left (editor/herdr)"
contexts = ["global"]
command = ["node", "nav.ts", "left"]

[[actions]]
id = "down"
title = "Navigate down (editor/herdr)"
contexts = ["global"]
command = ["node", "nav.ts", "down"]

[[actions]]
id = "up"
title = "Navigate up (editor/herdr)"
contexts = ["global"]
command = ["node", "nav.ts", "up"]

[[actions]]
id = "right"
title = "Navigate right (editor/herdr)"
contexts = ["global"]
command = ["node", "nav.ts", "right"]
